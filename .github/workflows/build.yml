name: Astro Build
on:
  pull_request:
  push:
    branches: [master, redesign]

permissions:
  contents: read

jobs:
  build:
    name: Check and build (no deployment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Package review source
        run: git archive --format=zip HEAD -o source.zip
      - name: Save review files
        uses: actions/upload-artifact@v4
        with:
          name: website-review
          path: |
            dist/
            source.zip
          retention-days: 14
