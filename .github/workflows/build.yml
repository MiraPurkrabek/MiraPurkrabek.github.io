name: Astro Build
on:
  pull_request:
  push:
    branches: [master, redesign]

permissions:
  contents: write

jobs:
  build:
    name: Check and build (no deployment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Prepare official affiliation logos
        if: github.ref == 'refs/heads/redesign'
        run: node scripts/fetch-affiliation-logos.mjs
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Install review browser
        if: github.ref == 'refs/heads/redesign'
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Capture desktop and mobile review
        if: github.ref == 'refs/heads/redesign'
        run: node scripts/capture-review.mjs
      - name: Save screenshots on redesign
        if: github.ref == 'refs/heads/redesign'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin redesign
          if [ "$(git rev-parse origin/redesign)" = "$GITHUB_SHA" ]; then
            git add docs/review public/assets/logos/vrg.png public/assets/logos/porsche-crest.png
            if ! git diff --cached --quiet; then
              git commit -m "Save official logos and redesign screenshots [skip ci]"
              git push origin HEAD:redesign
            fi
          fi
      - name: Package review source
        run: git archive --format=zip HEAD -o source.zip
      - name: Save review files
        uses: actions/upload-artifact@v4
        with:
          name: website-review
          path: |
            dist/
            source.zip
            docs/review/
          retention-days: 14
